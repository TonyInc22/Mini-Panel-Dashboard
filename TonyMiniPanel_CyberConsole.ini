[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=5,8,13,255
OnRefreshAction=["powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\AudioControl.ps1" -Action SyncMicrophone]

[Metadata]
Name=Tony Mini Panel Cyber Console
Author=OpenAI
Version=0.5
Information=1920x450 cyberpunk system dashboard

[Variables]
Font=Segoe UI
Mono=Consolas
HWiNFOPath=C:\Program Files\HWiNFO64\HWiNFO64.EXE

WeatherLatitude=39.7904
WeatherLongitude=-76.9847
WeatherURL=https://api.open-meteo.com/v1/forecast?latitude=#WeatherLatitude#&longitude=#WeatherLongitude#&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=1

BG=5,8,13,255
Panel=8,13,21,255
Panel2=10,16,26,255
Grid=22,42,58,255
Text=235,242,255,255
Muted=126,146,168,255

Cyan=0,229,255,255
CyanDim=0,85,102,255
Purple=190,65,255,255
PurpleDim=72,25,98,255
Pink=255,35,145,255
PinkDim=99,16,58,255
Amber=255,174,0,255
AmberDim=94,63,0,255
Green=72,255,72,255
GreenDim=25,88,25,255

SafeColor=72,255,72,255
WarnColor=255,174,0,255
DangerColor=255,65,80,255

; ============================================================
; MEASURES
; HWiNFO registry order supplied by user:
; 0 Total CPU Usage
; 1 CPU Package
; 2 Core Max
; 3 CPU Package Power
; 4 Drive Temperature
; 5 GPU Temperature
; 6 GPU Core Load
; ============================================================

[MeasureTime]
Measure=Time
Format=%#I:%M

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%B %#d, %Y

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m

[MeasureCPUUsage]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw0
MinValue=0
MaxValue=100
RegExpSubstitute=1
Substitute="^([0-9]+)\..*$":"\1"
DynamicVariables=1

[MeasureCPUPackage]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw1
DynamicVariables=1

[MeasureCoreMax]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw2
DynamicVariables=1

[MeasureCPUPower]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw3
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]+\.[0-9]).*$":"\1"

[MeasureDriveTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw4
DynamicVariables=1

[MeasureGPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw5
DynamicVariables=1

[MeasureGPUUsage]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw6
MinValue=0
MaxValue=100
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]+)\..*$":"\1"

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMAvailable]
Measure=PhysicalMemory
InvertMeasure=1

[MeasureDownloadMbps]
Measure=Calc
Formula=MeasureNetIn / 1000000
DynamicVariables=1

[MeasureUploadMbps]
Measure=Calc
Formula=MeasureNetOut / 1000000
DynamicVariables=1

[MeasureCUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
IgnoreRemovable=0

[MeasureCTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
IgnoreRemovable=0

[MeasureDUsed]
Measure=FreeDiskSpace
Drive=D:
InvertMeasure=1
IgnoreRemovable=0

[MeasureDTotal]
Measure=FreeDiskSpace
Drive=D:
Total=1
IgnoreRemovable=0
IfCondition=(MeasureDTotal > 0)
IfTrueAction=[!ShowMeterGroup DriveD]
IfFalseAction=[!HideMeterGroup DriveD]

[MeasureEUsed]
Measure=FreeDiskSpace
Drive=E:
InvertMeasure=1
IgnoreRemovable=0

[MeasureETotal]
Measure=FreeDiskSpace
Drive=E:
Total=1
IgnoreRemovable=0
IfCondition=(MeasureETotal > 0)
IfTrueAction=[!ShowMeterGroup DriveE]
IfFalseAction=[!HideMeterGroup DriveE]

[MeasureFUsed]
Measure=FreeDiskSpace
Drive=F:
InvertMeasure=1
IgnoreRemovable=0

[MeasureFTotal]
Measure=FreeDiskSpace
Drive=F:
Total=1
IgnoreRemovable=0
IfCondition=(MeasureFTotal > 0)
IfTrueAction=[!ShowMeterGroup DriveF]
IfFalseAction=[!HideMeterGroup DriveF]

[MeasureNetIn]
Measure=NetIn
Interface=Best
UseBits=1

[MeasureNetOut]
Measure=NetOut
Interface=Best
UseBits=1

[MeasureCPUTempColor]
Measure=Calc
Formula=MeasureCPUPackage
IfCondition=(MeasureCPUPackage < 75)
IfTrueAction=[!SetOption MeterCPUTempValue FontColor "#SafeColor#"][!UpdateMeter MeterCPUTempValue][!Redraw]
IfCondition2=(MeasureCPUPackage >= 75) && (MeasureCPUPackage < 85)
IfTrueAction2=[!SetOption MeterCPUTempValue FontColor "#WarnColor#"][!UpdateMeter MeterCPUTempValue][!Redraw]
IfCondition3=(MeasureCPUPackage >= 85)
IfTrueAction3=[!SetOption MeterCPUTempValue FontColor "#DangerColor#"][!UpdateMeter MeterCPUTempValue][!Redraw]

[MeasureGPUTempColor]
Measure=Calc
Formula=MeasureGPUTemp
IfCondition=(MeasureGPUTemp < 75)
IfTrueAction=[!SetOption MeterGPUTempValue FontColor "#SafeColor#"][!UpdateMeter MeterGPUTempValue][!Redraw]
IfCondition2=(MeasureGPUTemp >= 75) && (MeasureGPUTemp < 85)
IfTrueAction2=[!SetOption MeterGPUTempValue FontColor "#WarnColor#"][!UpdateMeter MeterGPUTempValue][!Redraw]
IfCondition3=(MeasureGPUTemp >= 85)
IfTrueAction3=[!SetOption MeterGPUTempValue FontColor "#DangerColor#"][!UpdateMeter MeterGPUTempValue][!Redraw]

[MeasureCUsagePercent]
Measure=Calc
Formula=(MeasureCTotal > 0 ? (MeasureCUsed / MeasureCTotal) * 100 : 0)
IfCondition=(MeasureDUsagePercent < 75)
IfTrueAction=[!SetOption MeterDriveDValue FontColor "#Text#"][!SetOption MeterDriveDBar BarColor "#Amber#"][!UpdateMeter MeterDriveDValue][!UpdateMeter MeterDriveDBar][!Redraw]
IfCondition2=(MeasureCUsagePercent >= 75) && (MeasureCUsagePercent < 90)
IfTrueAction2=[!SetOption MeterDriveCValue FontColor "#WarnColor#"][!SetOption MeterDriveCBar BarColor "#WarnColor#"][!UpdateMeter MeterDriveCValue][!UpdateMeter MeterDriveCBar][!Redraw]
IfCondition3=(MeasureCUsagePercent >= 90)
IfTrueAction3=[!SetOption MeterDriveCValue FontColor "#DangerColor#"][!SetOption MeterDriveCBar BarColor "#DangerColor#"][!UpdateMeter MeterDriveCValue][!UpdateMeter MeterDriveCBar][!Redraw]

[MeasureDUsagePercent]
Measure=Calc
Formula=(MeasureDTotal > 0 ? (MeasureDUsed / MeasureDTotal) * 100 : 0)
IfCondition=(MeasureUsagePercent < 75)
IfTrueAction=[!SetOption MeterDriveCValue FontColor "#Text#"][!SetOption MeterDriveCBar BarColor "#Amber#"][!UpdateMeter MeterDriveCValue][!UpdateMeter MeterDriveCBar][!Redraw]
IfCondition2=(MeasureDUsagePercent >= 75) && (MeasureDUsagePercent < 90)
IfTrueAction2=[!SetOption MeterDriveDValue FontColor "#WarnColor#"][!SetOption MeterDriveDBar BarColor "#WarnColor#"][!UpdateMeter MeterDriveDValue][!UpdateMeter MeterDriveDBar][!Redraw]
IfCondition3=(MeasureDUsagePercent >= 90)
IfTrueAction3=[!SetOption MeterDriveDValue FontColor "#DangerColor#"][!SetOption MeterDriveDBar BarColor "#DangerColor#"][!UpdateMeter MeterDriveDValue][!UpdateMeter MeterDriveDBar][!Redraw]

[MeasureEUsagePercent]
Measure=Calc
Formula=(MeasureETotal > 0 ? (MeasureEUsed / MeasureETotal) * 100 : 0)
IfCondition=(MeasureEUsagePercent < 75)
IfTrueAction=[!SetOption MeterDriveEValue FontColor "#Text#"][!SetOption MeterDriveEBar BarColor "#Amber#"][!UpdateMeter MeterDriveEValue][!UpdateMeter MeterDriveEBar][!Redraw]
IfCondition2=(MeasureEUsagePercent >= 75) && (MeasureEUsagePercent < 90)
IfTrueAction2=[!SetOption MeterDriveEValue FontColor "#WarnColor#"][!SetOption MeterDriveEBar BarColor "#WarnColor#"][!UpdateMeter MeterDriveEValue][!UpdateMeter MeterDriveEBar][!Redraw]
IfCondition3=(MeasureEUsagePercent >= 90)
IfTrueAction3=[!SetOption MeterDriveEValue FontColor "#DangerColor#"][!SetOption MeterDriveEBar BarColor "#DangerColor#"][!UpdateMeter MeterDriveEValue][!UpdateMeter MeterDriveEBar][!Redraw]

[MeasureFUsagePercent]
Measure=Calc
Formula=(MeasureFTotal > 0 ? (MeasureFUsed / MeasureFTotal) * 100 : 0)
IfCondition=(MeasureFUsagePercent < 75)
IfTrueAction=[!SetOption MeterDriveFValue FontColor "#Text#"][!SetOption MeterDriveFBar BarColor "#Amber#"][!UpdateMeter MeterDriveFValue][!UpdateMeter MeterDriveFBar][!Redraw]
IfCondition2=(MeasureFUsagePercent >= 75) && (MeasureFUsagePercent < 90)
IfTrueAction2=[!SetOption MeterDriveFValue FontColor "#WarnColor#"][!SetOption MeterDriveFBar BarColor "#WarnColor#"][!UpdateMeter MeterDriveFValue][!UpdateMeter MeterDriveFBar][!Redraw]
IfCondition3=(MeasureFUsagePercent >= 90)
IfTrueAction3=[!SetOption MeterDriveFValue FontColor "#DangerColor#"][!SetOption MeterDriveFBar BarColor "#DangerColor#"][!UpdateMeter MeterDriveFValue][!UpdateMeter MeterDriveFBar][!Redraw]

; ============================================================
; NETWORK DETAIL AND ANIMATION
; ============================================================

[MeasureDownloadKbps]
Measure=Calc
Formula=MeasureNetIn / 1000
DynamicVariables=1

[MeasureUploadKbps]
Measure=Calc
Formula=MeasureNetOut / 1000
DynamicVariables=1

; Shared slow pulse from 0.0 to 1.0
[MeasurePulse]
Measure=Calc
Formula=(Sin(Counter / 2) + 1) / 2
DynamicVariables=1

; Download glow activates above 1 Mbps
[MeasureDownloadGlowAlpha]
Measure=Calc
Formula=(MeasureDownloadMbps >= 1 ? Round(35 + (MeasurePulse * 145)) : 0)
DynamicVariables=1

; Upload glow activates above 0.25 Mbps
[MeasureUploadGlowAlpha]
Measure=Calc
Formula=(MeasureUploadMbps >= 0.25 ? Round(35 + (MeasurePulse * 145)) : 0)
DynamicVariables=1

; Temperature danger glow activates at 85 C
[MeasureCPUTempGlowAlpha]
Measure=Calc
Formula=(MeasureCPUPackage >= 85 ? Round(50 + (MeasurePulse * 170)) : 0)
DynamicVariables=1

[MeasureGPUTempGlowAlpha]
Measure=Calc
Formula=(MeasureGPUTemp >= 85 ? Round(50 + (MeasurePulse * 170)) : 0)
DynamicVariables=1

; ============================================================
; WEBNOWPLAYING MEDIA
; ============================================================

[MeasureAudioOutput]
Measure=Plugin
Plugin=AudioLevel
Port=Output

[MeasureAudioOutputName]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Type=DeviceName
Substitute="":"--"

[MeasureMediaTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
Substitute="":"N/A"

[MeasureMediaArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
Substitute="":"N/A"

[MeasureMediaCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
; The DefaultPath will be returned when no cover art has been found.
DefaultPath=#@#Images\nocover.png

[MeasureMediaPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
Substitute="":"--:--"

[MeasureMediaDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration
Substitute="":"--:--"

[MeasureMediaRemainingDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Remaining
RegExpSubstitute=1
Substitute="^$":"--:--","^0([0-9]):":"\1:"

[MeasureMediaProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
MinValue=0
MaxValue=100

[MeasureMediaState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
Substitute="0":"PLAY","1":"PAUSE","2":"PLAY","3":"REPLAY"
IfCondition=(MeasureMediaState = 1)
IfTrueAction=[!HideMeter "MeterMediaPlayIcon"][!ShowMeter "MeterMediaPauseIcon"][!Redraw]
IfFalseAction=[!ShowMeter "MeterMediaPlayIcon"][!HideMeter "MeterMediaPauseIcon"][!Redraw]

; ============================================================
; WEATHER - HANOVER, PA 17331
; ============================================================

[MeasureWeatherRaw]
Measure=WebParser
URL=#WeatherURL#
RegExp=(?si)"temperature_2m"\s*:\s*(-?[\d.]+).*?"apparent_temperature"\s*:\s*(-?[\d.]+).*?"weather_code"\s*:\s*(\d+).*?"wind_speed_10m"\s*:\s*(-?[\d.]+).*?"relative_humidity_2m"\s*:\s*(\d+).*?"temperature_2m_max"\s*:\s*\[\s*(-?[\d.]+).*?"temperature_2m_min"\s*:\s*\[\s*(-?[\d.]+)
UpdateRate=900
DynamicVariables=1

[MeasureWeatherTemp]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=1
Substitute="":"--"
NumOfDecimals=0

[MeasureWeatherFeels]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=2
Substitute="":"--"
NumOfDecimals=0

[MeasureWeatherCondition]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=3
Substitute="":"LOADING","0":"CLEAR","1":"MOSTLY CLEAR","2":"PARTLY CLOUDY","3":"OVERCAST","45":"FOG","48":"RIME FOG","51":"LIGHT DRIZZLE","53":"DRIZZLE","55":"HEAVY DRIZZLE","56":"FREEZING DRIZZLE","57":"HEAVY FREEZING DRIZZLE","61":"LIGHT RAIN","63":"RAIN","65":"HEAVY RAIN","66":"FREEZING RAIN","67":"HEAVY FREEZING RAIN","71":"LIGHT SNOW","73":"SNOW","75":"HEAVY SNOW","77":"SNOW GRAINS","80":"LIGHT SHOWERS","81":"SHOWERS","82":"HEAVY SHOWERS","85":"SNOW SHOWERS","86":"HEAVY SNOW SHOWERS","95":"THUNDERSTORM","96":"THUNDERSTORM / HAIL","99":"HEAVY THUNDERSTORM"

[MeasureWeatherWind]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=4
Substitute="":"--"
NumOfDecimals=0

[MeasureWeatherHumidity]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=5
Substitute="":"--"
